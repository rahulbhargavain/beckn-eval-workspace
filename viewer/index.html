<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Conformance Report Viewer</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#59636e; --line:#d1d9e0; --pass:#1a7f37; --fail:#cf222e; --warn:#9a6700; --card:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --pass:#3fb950; --fail:#f85149; --warn:#d29922; --card:#161b22; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; max-width:960px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  p.sub { margin:0 0 16px; color:var(--muted); }
  #drop { border:2px dashed var(--line); border-radius:8px; padding:20px; text-align:center; background:var(--card); }
  #drop.over { border-color:var(--fg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:12px 0; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-weight:600; border:1px solid currentColor; }
  .CERTIFIED,.pass { color:var(--pass); } .FAILED,.fail { color:var(--fail); }
  .INCOMPLETE,.pending,.UNKNOWN,.unknown { color:var(--warn); }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; margin:8px 0 0; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  .mono { font-family:ui-monospace, Consolas, monospace; font-size:.85em; }
  .alert { border-left:4px solid var(--fail); padding:6px 10px; margin:8px 0; background:var(--card); }
  .scroll { overflow-x:auto; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>Conformance Report Viewer</h1>
<p class="sub">Read-only. The report is read in your browser and sent nowhere. The signature is not verified here.</p>
<div id="drop">
  <p>Drop a <code>report*.json</code> file here, or choose one.</p>
  <input id="file" type="file" accept="application/json,.json" aria-label="Choose a report file">
</div>
<div id="error" class="alert" role="alert" hidden></div>
<div id="out" hidden></div>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
