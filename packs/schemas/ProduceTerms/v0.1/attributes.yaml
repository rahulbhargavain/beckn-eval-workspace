openapi: 3.1.1
info:
  title: ProduceTerms attributes
  version: 0.1.0
components:
  schemas:
    ProduceTerms:
      title: ProduceTerms
      description: Quantity unit and ordering terms for produce, used for arithmetic
        when quoting. availableQuantity is a snapshot taken when the catalog was published;
        the seller's stock check at select/confirm is authoritative.
      type: object
      required:
      - '@context'
      - '@type'
      properties:
        '@context':
          type: string
        '@type':
          type: string
        unitCode:
          type: string
        minOrderQuantity:
          type: integer
          minimum: 1
        deliveryLeadDays:
          type: integer
          minimum: 0
        availableQuantity:
          type: number
          minimum: 0
