openapi: 3.1.1
info:
  title: EnergyTerms attributes
  version: 0.1.0
components:
  schemas:
    EnergyTerms:
      title: EnergyTerms
      description: Delivery window and quantity terms for an energy offer. Placeholder
        for DEG EnergyTradeOffer.
      type: object
      required:
      - '@context'
      - '@type'
      properties:
        '@context':
          type: string
        '@type':
          type: string
        unitCode:
          type: string
        deliveryWindow:
          type: object
          required:
          - start
          - end
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        minQuantityKwh:
          type: integer
          minimum: 1
