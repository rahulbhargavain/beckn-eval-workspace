openapi: 3.1.1
info:
  title: Produce attributes
  version: 0.1.0
components:
  schemas:
    Produce:
      title: Produce
      description: Compliance and freshness facts for agricultural produce. Name,
        grade and description belong in the Descriptor.
      type: object
      required:
      - '@context'
      - '@type'
      properties:
        '@context':
          type: string
        '@type':
          type: string
        originCountry:
          type: string
          pattern: ^[A-Z]{2}$
        harvestDate:
          type: string
          format: date
        certifications:
          type: array
          items:
            type: string
