openapi: 3.1.1
info:
  title: Listing attributes
  version: 0.1.0
components:
  schemas:
    Listing:
      title: Listing
      description: Filterable facts for a tourism listing. Name, place description
        and media belong in the Descriptor.
      type: object
      required:
      - '@context'
      - '@type'
      properties:
        '@context':
          type: string
        '@type':
          type: string
        category:
          type: string
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
        capacity:
          type: integer
          minimum: 1
